
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So Clover ! - Édition Numérique</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-emerald-950 text-emerald-100 min-h-screen flex flex-col items-center justify-between p-4">

    <div id="app" class="w-full max-w-4xl mx-auto flex flex-col items-center flex-grow justify-center">
        <h1 class="text-4xl font-bold text-emerald-400 mb-2 tracking-wide">SO CLOVER !</h1>
        <p class="text-emerald-300/80 mb-8 text-sm">Le jeu coopératif de mots et d'association</p>

        <!-- Écran d'accueil / Menu -->
        <div id="menu-screen" class="bg-emerald-900/60 p-6 rounded-2xl shadow-xl border border-emerald-700/50 w-full max-w-md flex flex-col gap-4">
            <h2 class="text-xl font-semibold text-emerald-200 text-center mb-2">Menu Principal</h2>
            
            <div>
                <label class="block text-sm font-medium text-emerald-300 mb-1">Difficulté (Cartes pièges) :</label>
                <select id="difficulty-select" class="w-full bg-emerald-950 border border-emerald-700 rounded-lg p-2.5 text-emerald-100 focus:outline-none focus:border-emerald-400">
                    <option value="1">Facile (1 carte piège)</option>
                    <option value="2" selected>Normal (2 cartes pièges)</option>
                    <option value="3">Difficile (3 cartes pièges)</option>
                </select>
            </div>

            <button id="btn-create-game" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95">
                Créer une nouvelle partie
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-emerald-700"></div>
                <span class="flex-shrink mx-4 text-emerald-400 text-sm">ou rejoindre</span>
                <div class="flex-grow border-t border-emerald-700"></div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="input-room-code" placeholder="Code du salon (ex: AB12)" class="flex-grow bg-emerald-950 border border-emerald-700 rounded-lg p-2.5 text-emerald-100 uppercase tracking-widest text-center focus:outline-none focus:border-emerald-400">
                <button id="btn-join-game" class="bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl transition">
                    Rejoindre
                </button>
            </div>
        </div>

        <!-- Écran de jeu (masqué par défaut) -->
        <div id="game-screen" class="hidden w-full flex flex-col items-center">
            <div id="status-bar" class="bg-emerald-900/80 px-4 py-2 rounded-lg border border-emerald-700 mb-4 text-sm flex justify-between w-full max-w-xl">
                <span>Salon : <strong id="room-code-display" class="text-emerald-400"></strong></span>
                <span id="game-status-text" class="text-emerald-300">En attente...</span>
            </div>
            <div id="game-board-container" class="w-full flex justify-center">
                <!-- Le plateau de jeu sera injecté ici -->
            </div>
        </div>
    </div>

    <footer class="mt-8 text-xs text-emerald-500/60">
        So Clover ! Web Edition &bull; Hébergé sur GitHub Pages
    </footer>

    <script>
        // Configuration Supabase
        const SUPABASE_URL = "https://ckvqujwxzlpdfwxbuqno.supabase.co";
        const SUPABASE_KEY = "sb_publishable__8RopAM6dop73hqiygWiTQ_PH9riFog";
        
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Erreur d'initialisation de Supabase :", e);
        }

        // Générateur de code de salon aléatoire
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Gestion des clics sur les boutons
        document.addEventListener('DOMContentLoaded', () => {
            const btnCreate = document.getElementById('btn-create-game');
            const btnJoin = document.getElementById('btn-join-game');
            const inputRoom = document.getElementById('input-room-code');

            if (btnCreate) {
                btnCreate.addEventListener('click', async () => {
                    const roomCode = generateRoomCode();
                    const difficulty = document.getElementById('difficulty-select').value;
                    
                    console.log(`Création du salon ${roomCode} avec la difficulté ${difficulty}`);

                    // Optionnel : Enregistrer la partie dans Supabase si la table 'games' existe
                    if (supabaseClient) {
                        try {
                            const { error } = await supabaseClient
                                .from('games')
                                .insert([{ room_code: roomCode, difficulty: parseInt(difficulty), status: 'waiting' }]);
                            if (error) console.warn("Attention (table Supabase absente ou non configurée) :", error.message);
                        } catch (err) {
                            console.error("Erreur réseau Supabase :", err);
                        }
                    }

                    // Mettre à jour l'URL et afficher l'écran de jeu
                    const newUrl = `${window.location.pathname}?room=${roomCode}`;
                    window.history.pushState({ room: roomCode }, '', newUrl);
                    
                    showGameScreen(roomCode);
                });
            }

            if (btnJoin && inputRoom) {
                btnJoin.addEventListener('click', () => {
                    const code = inputRoom.value.trim().toUpperCase();
                    if (code.length === 4) {
                        const newUrl = `${window.location.pathname}?room=${code}`;
                        window.history.pushState({ room: code }, '', newUrl);
                        showGameScreen(code);
                    } else {
                        alert("Veuillez entrer un code de salon valide à 4 caractères.");
                    }
                });
            }

            // Vérifier si une URL contient déjà un paramètre ?room=XXXX au chargement
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                showGameScreen(roomParam);
            }
        });

        function showGameScreen(roomCode) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-code-display').textContent = roomCode;
            document.getElementById('game-status-text').textContent = "Phase 1 : Choix des indices";
            
            // Exemple de rendu visuel de base du plateau
            const container = document.getElementById('game-board-container');
            container.innerHTML = `
                <div class="bg-emerald-900/40 border border-emerald-700 p-6 rounded-xl text-center max-w-md w-full">
                    <p class="text-emerald-200 mb-4">Salon actif : <span class="font-bold text-emerald-400">${roomCode}</span></p>
                    <p class="text-sm text-emerald-300/80 mb-6">Partagez l'URL actuelle de votre navigateur à vos coéquipiers pour les faire rejoindre ce salon !</p>
                    <button onclick="navigator.clipboard.writeText(window.location.href); alert('Lien copié dans le presse-papier !');" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg w-full">
                        Copier le lien d'invitation
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
